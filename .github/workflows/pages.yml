# Publishes the map tiles of the Urban Footprint web app (https://github.com/VictorHaydin/urban-footprint)
# to GitHub Pages. Tiles are produced by that project's pipeline and copied here with
#   python -m urbanfp publish-tiles ../urban-footprint-data
name: Deploy tiles to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
